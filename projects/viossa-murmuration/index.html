  :root {
    --ui: 'Tilda Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --display: 'Lithium', Georgia, serif;
    --ink: #000; --menu-ink: #000; --warn: #b3261e;
    --glass: linear-gradient(110deg, rgb(255 255 255 / .3), rgb(255 255 255 / .1));
    --glass-hover: linear-gradient(110deg, rgb(255 255 255 / .5), rgb(255 255 255 / .2));
    --glass-on: linear-gradient(110deg, rgb(255 255 255 / .8), rgb(255 255 255 / .4));
    --menu: linear-gradient(110deg, rgb(255 255 255 / .8), rgb(255 255 255 / .4));
    --edge: linear-gradient(150deg, rgb(255 255 255 / .8), rgb(255 255 255 / .1));
    --gut: 35px; --top: 23px; --bottom: 40px;
    --fs: clamp(36px, 5.3vw, 70px);
  }
  /* тёмный фон: птицы белые, текст кнопок и меню тоже */
  body.dark {
    --ink: #fff; --menu-ink: #fff; --warn: #ff8a80;
    --glass: linear-gradient(110deg, rgb(255 255 255 / .16), rgb(255 255 255 / .05));
    --glass-hover: linear-gradient(110deg, rgb(255 255 255 / .26), rgb(255 255 255 / .1));
    --glass-on: linear-gradient(110deg, rgb(255 255 255 / .34), rgb(255 255 255 / .16));
    --menu: linear-gradient(110deg, rgb(48 48 48 / .9), rgb(30 30 30 / .7));
    --edge: linear-gradient(150deg, rgb(255 255 255 / .45), rgb(255 255 255 / .06));
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #8f8fb8; color: var(--ink); font: 18px/1 var(--ui); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  #main-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  /* стекло: пилюли, круглая кнопка фона, меню */
  .glass { position: relative; display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 16px;
           border: 0; border-radius: 999px; background: var(--glass); color: var(--ink); font: 18px/1 var(--ui); cursor: pointer; white-space: nowrap; }
  .glass::before, .menu::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--edge);
           -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
           mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); pointer-events: none; }
  .glass:hover { background: var(--glass-hover); }
  .glass.on, .glass:active { background: var(--glass-on); }
  .glass:focus-visible, #play:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  .glass.small { height: 22px; padding: 0 8px; font-size: 12px; }
  .swatch { width: 36px; padding: 0; background: var(--sw); }
  .swatch:hover, .swatch:active { background: var(--sw); filter: brightness(1.06); }
  .square { width: 38px; padding: 0; }

  .corner.top { top: var(--top); bottom: auto; left: var(--gut); }
  /* «←» — обратно на сайт; на локальном файле её нет, и «alphabet» встаёт в угол */
  #back-btn { text-decoration: none; }
  .corner.topright { top: var(--top); bottom: auto; right: var(--gut); }
  #about-menu { right: var(--gut); top: calc(var(--top) + 44px); width: min(360px, calc(100vw - 2 * var(--gut)));
                font: 16px/1.4 var(--ui); gap: 10px; }
  #about-menu p { margin: 0; }
  #about-menu a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .corner { position: fixed; bottom: var(--bottom); display: flex; gap: 8px; }
  .corner.left { left: var(--gut); }
  .corner.right { right: var(--gut); gap: 5px; }
  #play { position: fixed; left: 50%; bottom: var(--bottom); transform: translateX(-50%); width: 65px; height: 65px;
          padding: 0; border: 0; background: none; cursor: pointer; }
  #play svg { display: block; transition: opacity .15s; opacity: .92; }
  #play:hover svg { opacity: 1; }
  body.playing .i-play, body:not(.playing) .i-pause { display: none; }
  /* во время показа остаются только экспорт, масштаб и пауза */
  body.playing .corner.top, body.playing .corner.left, body.playing #compose { display: none; }

  /* меню */
  .menu { position: fixed; z-index: 2; display: grid; gap: 12px; min-width: 212px; max-width: calc(100vw - 2 * var(--gut));
          padding: 17px; border-radius: 16px; background: var(--menu); color: var(--menu-ink); font: 18px/18px var(--ui); }
  #settings-menu { left: var(--gut); bottom: calc(var(--bottom) + 44px); }
  #export-menu { right: var(--gut); top: calc(var(--top) + 44px); }
  #alphabet-menu { left: calc(var(--gut) + var(--back, 0px)); top: calc(var(--top) + 44px); grid-template-columns: auto auto; column-gap: 36px; row-gap: 6px;
                   max-height: calc(100vh - var(--top) - 44px - 24px); overflow-y: auto; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 24px; height: 18px; white-space: nowrap; outline: none; cursor: default; }
  .row .val { font-variant-numeric: tabular-nums; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .row:focus .val, .row:focus-within .val { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .row.action { cursor: pointer; }
  .row.action:focus .lab { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .row.action:focus .val { text-decoration: none; }
  .row.pager .lab { font-weight: 600; }
  .row.io { margin-top: 6px; }
  .row.io [data-io] { cursor: pointer; }
  .row.io [data-io] { outline: none; }
  .row.io [data-io]:hover, .row.io [data-io]:focus { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .row.pager .val { gap: 4px; }
  .row.pager .val span { padding: 0 3px; }
  .row:focus.pager .val { text-decoration: none; }
  .row:focus.pager .lab { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .row input.edit { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; outline: none; text-align: right;
                    font-variant-numeric: tabular-nums; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .row .ico { width: 16px; height: 16px; fill: currentColor; }
  .chip { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .25); }
  #alphabet-menu .row { height: 28px; }
  #alphabet-menu .row.wide { grid-column: 1 / -1; height: 18px; margin-top: 6px; }
  #alphabet-menu .lab.dup { color: var(--warn); }
  .glyph { display: grid; grid-template-rows: repeat(4, 7px); width: 28px; }
  .glyph i { display: flex; align-items: center; }
  .glyph b { display: block; width: 100%; background: currentColor; }
  body.admin .glyph { cursor: pointer; }
  #alphabet-menu .row { cursor: text; }
  #alphabet-menu .row:focus .val { text-decoration: none; }
  /* подпись и поле ввода буквы — одного размера, чтобы при щелчке ничего не прыгало */
  #alphabet-menu .lab, .row input.edit.sign { flex: none; width: 3ch; height: 18px; line-height: 18px; }
  #alphabet-menu .row:focus .lab { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  #alphabet-menu .row.action:focus .lab { text-decoration: underline; }
  .row input.edit.sign { text-align: left; }
  .row input.edit.dup { color: var(--warn); }

  /* текст: поле на самом холсте */
  #compose { position: fixed; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 16px; }
  #text, #mirror, #caption { font: var(--fs)/1.4 var(--display); letter-spacing: 0; }
  #text { display: block; padding: 0; margin: 0; border: 0; border-bottom: 1px solid rgb(255 255 255 / .4); border-radius: 0;
          background: none; color: #fff; caret-color: #fff; text-align: center; resize: none; overflow: hidden auto; outline: none;
          scrollbar-width: none;
          white-space: pre-wrap; overflow-wrap: break-word; }
  #text::-webkit-scrollbar { display: none; }
  #text::placeholder { color: rgb(255 255 255 / .7); }
  #mirror { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none; white-space: pre-wrap; overflow-wrap: break-word; width: max-content; }
  #hints { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #caption { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--fs) * 50 / 70); color: #fff;
             white-space: nowrap; pointer-events: none; }
  #picker { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  @media (max-width: 640px) {

function stepParam(c, d, big) {
  if (c.type === 'bool') return setParam(c.key, !P[c.key]);
  if (c.type === 'select') {
    const i = c.opts.findIndex(o => o[0] === P[c.key]);
    return setParam(c.key, c.opts[(i + d + c.opts.length) % c.opts.length][0]);
  }
  if (c.type === 'color') return;
  const st = c.step * (big ? 10 : 1);
  let v = +(Math.round((P[c.key] + d * st) / c.step) * c.step).toFixed(6);
  v = c.type === 'range' ? Math.min(c.max, Math.max(c.min, v)) : Math.max(0, v);
  setParam(c.key, v);
}
function clickParam(c, r) {
  if (c.type === 'bool' || c.type === 'select') return stepParam(c, 1);
  if (c.type === 'color') { pickKey = c.key; picker.value = P[c.key]; picker.click(); return; }
  editNumber(c, r);
}
// Число вводится прямо на месте значения; применяется по мере ввода.
function editNumber(c, r) {
  const val = r.querySelector('.val'); if (!val) return;
  const inp = document.createElement('input');
  inp.className = 'edit'; inp.inputMode = 'decimal'; inp.value = num(P[c.key]);
  const fit = () => { inp.style.width = Math.max(2, inp.value.length + 0.5) + 'ch'; };
  fit(); val.replaceWith(inp); inp.focus(); inp.select(); editing = true;
  const before = P[c.key];
  let done = false;
  const apply = v => { if (!isFinite(v)) return; P[c.key] = c.type === 'int' ? Math.round(v) : v; saveParams(); lastInput = performance.now();
    if (DRAW_ONLY.has(c.key)) dirty = true; else rebuild(); };
  const finish = (ok, refocus) => {
    if (done) return; done = true; editing = false;
    if (!ok) apply(before);
    const span = document.createElement('span'); span.className = 'val';
    inp.replaceWith(span); renderMenu();
    if (refocus) r.focus();
  };
  inp.addEventListener('input', () => { fit(); apply(parseNum(inp.value)); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true, true); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false, true); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault(); e.stopPropagation();
      stepParam(c, e.key === 'ArrowUp' ? 1 : -1, e.shiftKey); inp.value = num(P[c.key]); fit(); inp.select();
    }
  });
  inp.addEventListener('blur', () => finish(true, false));
}
const picker = $('#picker'); let pickKey = null;
picker.addEventListener('input', () => { if (pickKey) setParam(pickKey, picker.value); });

// Экспорт: картинка и видео, как раньше.
const ICON = {
  image: '<svg class="ico" viewBox="0 0 448 512" aria-hidden="true"><path d="M64 32C29 32 0 61 0 96V416C0 451 29 480 64 480H384C419 480 448 451 448 416V96C448 61 419 32 384 32H64ZM128 112C155 112 176 133 176 160C176 187 155 208 128 208C101 208 80 187 80 160C80 133 101 112 128 112ZM272 224C280 224 288 228 293 236L381 380C385 387 385 396 381 404C377 411 369 416 360 416H88C79 416 71 411 67 403C63 395 63 386 68 378L124 298C129 292 136 288 144 288C152 288 159 292 164 298L190 336L252 236C256 229 264 224 272 224Z"/></svg>',

// Алфавит: у каждой буквы — её знак из четырёх линий. Выдели букву и впиши другую — знак
// перейдёт к ней. Совпавшие буквы (и то, что буквой алфавита не является) подсвечены красным;
// пока меню открыто, это можно исправить, а если при закрытии совпадения остались, алфавит
// возвращается к виду на момент открытия. Сами знаки меняются только в расширенном режиме:
// щелчок по линии — её толщина (тонкая → средняя → толстая), стрелки — все 81 код.
const codeOf = g => g.lines.map(l => l.t).join('');
const SIGNS = PHONEMES.filter(p => !'_,.'.includes(p.id));
const isSign = id => SIGNS.some(p => p.id === id);
let alphaRows = null, alphaSnap = null;
function openAlphabet() { alphaSnap = clone(ALPHA); alphaRows = SIGNS.map(p => ({ label: p.id, glyph: clone(ALPHA[p.id]) })); }
function clashTest() {
  const n = {}; for (const r of alphaRows) n[r.label] = (n[r.label] || 0) + 1;
  return r => !isSign(r.label) || n[r.label] > 1;
}
// Пока совпадений нет, стая сразу пишет новым алфавитом.
function applyAlphabet() {
  if (alphaRows.some(clashTest())) return false;
  for (const r of alphaRows) ALPHA[r.label] = clone(r.glyph);
  store.set('alphabet', ALPHA); lastInput = performance.now(); rebuild();
  return true;
}
function closeAlphabet() {
  if (alphaRows && !applyAlphabet()) { ALPHA = alphaSnap; store.set('alphabet', ALPHA); rebuild(); }
  alphaRows = alphaSnap = null;
}
// Вписанное читается теми же правилами, что и текст: š → sh, č → ch, dž → dj.
function parseSign(s) {
  const { tokens } = tokenize(s);
  return tokens.length === 1 && tokens[0].mult === 1 && isSign(tokens[0].id) ? tokens[0].id : s.trim().toLowerCase();
}
function alphabetRows() {
  if (!alphaRows) openAlphabet();
  const clash = clashTest(), codes = {};
  for (const r of alphaRows) (codes[codeOf(r.glyph)] ||= []).push(r.label);
  const half = Math.ceil(alphaRows.length / 2);
  let h = '';
  // две колонки, порядок — сверху вниз
  for (let i = 0; i < half; i++) for (const j of [i, i + half]) {
    const r = alphaRows[j]; if (!r) continue;
    const code = codeOf(r.glyph), twins = admin ? codes[code].filter(x => x !== r.label) : [];
    const k = 'ph:' + j, a = ACT[k] = { click: el => editSign(j, el), type: (el, ch) => editSign(j, el, ch), any: true };
    if (admin) {
      a.step = d => setCode(j, ((parseInt(code, 3) + d + 81) % 81).toString(3).padStart(4, '0'));
      a.line = l => setCode(j, code.slice(0, l) + (+code[l] + 1) % 3 + code.slice(l + 1));
    }
    const ipa = (SIGNS.find(p => p.id === r.label) || {}).ipa;
    const glyph = `<span class="glyph">${r.glyph.lines.map((ln, l) => `<i data-l="${l}"><b style="height:${[1, 3, 6][ln.t]}px"></b></i>`).join('')}</span>`;
    h += row(k, esc(r.label) || '·', glyph, {
      labCls: clash(r) || twins.length ? 'dup' : '',
      title: (ipa ? `/${ipa}/` : '') + (admin ? ` · ${code}` : '') + (twins.length ? ` · ${t('same')}: ${twins.join(', ')}` : ''),
    });
  }
  ACT.resetAlpha = { click: () => {
    ALPHA = clone(DEFAULTS); store.set('alphabet', ALPHA); rebuild();
    const snap = alphaSnap; openAlphabet(); alphaSnap = snap; renderMenu();
  } };
  return h + row('resetAlpha', t('resetAlpha'), '', { cls: 'action wide' });
}
function setCode(j, code) {
  alphaRows[j].glyph.lines = [...code].map(c => ({ t: +c }));
  applyAlphabet(); renderMenu();
}
// Буква вписывается на месте подписи; можно и просто начать печатать на выделенной строке.
function editSign(j, r, initial) {
  const lab = r.querySelector('.lab'); if (!lab) return;
  const sign = alphaRows[j], before = sign.label;
  const inp = document.createElement('input');
  inp.className = 'edit sign'; inp.maxLength = 3; inp.spellcheck = false; inp.autocapitalize = 'off';
  inp.value = initial ?? sign.label;
  lab.replaceWith(inp); inp.focus();
  if (initial == null) inp.select(); else inp.setSelectionRange(inp.value.length, inp.value.length);
  let done = false;
  const update = () => { sign.label = parseSign(inp.value); applyAlphabet(); renderMenu(); inp.classList.toggle('dup', clashTest()(sign)); };
  const finish = (ok, refocus) => {
    if (done) return; done = true;
    if (!ok) { sign.label = before; applyAlphabet(); }
    const span = document.createElement('span'); span.className = 'lab';
    inp.replaceWith(span); renderMenu();
    if (refocus) r.focus();
  };
  inp.addEventListener('input', update);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true, true); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false, true); }
  });
  inp.addEventListener('blur', () => finish(true, false));
  if (initial != null) update();
}

for (const sel of Object.values(MENUS)) {
  const el = $(sel);
  el.addEventListener('click', e => {
    const r = e.target.closest('.row'), a = r && ACT[r.dataset.k]; if (!a) return;
    const dir = e.target.closest('[data-dir]'), line = e.target.closest('[data-l]'), io = e.target.closest('[data-io]');
    if (io && a.pick) a.pick(+io.dataset.io);
    else if (dir && a.step) a.step(+dir.dataset.dir);
    else if (line && a.line) a.line(+line.dataset.l);
    else if (a.click && (a.any || r.classList.contains('action') || e.target.closest('.val'))) a.click(r);
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      // Tab ходит по кругу внутри открытого меню
      const stops = [...el.querySelectorAll('[tabindex="0"]')]; if (!stops.length) return;
      e.preventDefault();
      const i = stops.indexOf(document.activeElement.closest('[tabindex="0"]'));
      stops[(i + (e.shiftKey ? -1 : 1) + stops.length) % stops.length].focus();
      return;
    }
    if (e.target.tagName === 'INPUT') return;
    const r = e.target.closest('.row'), a = r && ACT[r.dataset.k]; if (!a) return;
    const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
    if (d && a.step) { e.preventDefault(); a.step(d, e.shiftKey); }
    else if ((e.key === 'Enter' || e.key === ' ') && a.click) { e.preventDefault(); a.click(r); }
    else if (a.type && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); a.type(r, e.key); }
  });
}

// ─── Фон ─────────────────────────────────────────────────────────────────
function applyTheme() {
  const th = THEMES[P.theme] || THEMES.sunset;
  document.body.classList.toggle('dark', !!th.dark);
  document.body.style.background = P.bg;
  const b = $('#theme-btn');
  b.style.setProperty('--sw', `linear-gradient(160deg, ${th.bg}, ${th.bg2})`);
  b.title = `${t('background')}: ${th[lang === 'ru' ? 'ru' : 'en']}`; b.setAttribute('aria-label', b.title);
}
$('#theme-btn').addEventListener('click', () => {
  const ks = Object.keys(THEMES), n = ks[(ks.indexOf(P.theme) + 1) % ks.length];
  P.theme = n; for (const k of THEME_KEYS) P[k] = THEMES[n][k];
  saveParams(); dirty = true; applyTheme(); renderMenu();
});

// ─── Текст — на самом холсте ─────────────────────────────────────────────
// Ширина по тексту, до 1000 px. Одна-две строки растут вверх от нижнего края поля.
// С третьей строки поле растёт вниз, пока не встанет в 30 px над нижними кнопками;
// дальше поле упирается в верх экрана, а текст уползает за край — прокручивается внутри поля,
// поэтому строка с курсором всегда видна, а начало возвращается колесом.
const compose = $('#compose'), mirror = $('#mirror'), hintsEl = $('#hints');
hintsEl.innerHTML = HINTS.map(s => `<button class="glass small" type="button">${s}</button>`).join('');
hintsEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  textEl.value = b.textContent; textEl.dispatchEvent(new Event('input'));
  textEl.focus(); textEl.setSelectionRange(textEl.value.length, textEl.value.length);
});
function textMetrics() { const fs = parseFloat(getComputedStyle(textEl).fontSize); return { fs, lh: fs * 1.4, k: fs / 70 }; }
function layoutText() {
  const { lh, k } = textMetrics();
  // как на макете — по 165 px с боков, чтобы две строки не заходили под верхние кнопки; на узком экране шире
  const maxW = Math.min(1000, Math.max(innerWidth - 330, innerWidth * 0.6));
  mirror.style.maxWidth = maxW + 'px';
  mirror.textContent = (textEl.value || textEl.placeholder) + '\u200b';
  const n = Math.max(1, Math.round(mirror.offsetHeight / lh));
  const w = n > 1 ? maxW : Math.min(maxW, Math.ceil(mirror.offsetWidth) + 4);
  textEl.style.width = w + 'px'; textEl.style.height = n * lh + 'px';
  const minTop = 2 * k, anchor = 100 * k + lh;
  const top = n <= 2 ? Math.max(minTop, anchor - n * lh) : minTop;
  const maxBottom = $('#play').getBoundingClientRect().top - 30;
  const full = top + n * lh > maxBottom;
  if (full) textEl.style.height = maxBottom + 'px';
  compose.style.top = (full ? 0 : top) + 'px';
  hintsEl.hidden = textEl.value !== '';
}
textEl.addEventListener('input', () => {
  layoutText(); store.set('text', textEl.value); rebuild();
  if (play) stopPlay();
});
addEventListener('resize', layoutText);
document.fonts?.ready.then(layoutText);

// Субтитры во время показа — в том же поле и тем же шрифтом.
let captionText = null;
function setCaption(s, op = 1) {
  const el = $('#caption');
  if (s !== captionText) { captionText = s; el.textContent = s; el.hidden = !s; }
  el.style.opacity = op.toFixed(3);
}
// В видео субтитр рисуется на самом холсте — запись видит только его.
function drawCaption(c, W, dpr, s, op) {
  const { fs, lh } = textMetrics();
  c.font = `${fs * dpr}px Lithium, Georgia, serif`; c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.globalAlpha = op; c.fillText(s, W / 2, (fs * 50 / 70 + lh / 2) * dpr); c.globalAlpha = 1;
}

// ─── Показ ───────────────────────────────────────────────────────────────
function setPlaying(on) {
  document.body.classList.toggle('playing', on);
  $('#play').setAttribute('aria-label', t(on ? 'stop' : 'play'));
  if (on) { if (openMenu !== 'export') setMenu(null); textEl.blur(); } else setCaption('');
}
$('#play').onclick = () => { if (play) stopPlay(); else startPlay(); };

// ─── Экспорт ─────────────────────────────────────────────────────────────
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
const fileBase = () => `viossa-${currentText().trim().replace(/[^\p{L}\p{N}]+/gu, '-').slice(0, 40) || 'murmur'}`;
function savePng() {
  if (needRebuild || !scene || scene.f < 1) { scene = makeScene(glyphsFromText(), viewP()); scene.f = 1; needRebuild = false; }
  const c = document.createElement('canvas'), k = 3, r = canvas.getBoundingClientRect();
  c.width = r.width * k; c.height = r.height * k;
  drawScene(c.getContext('2d'), c.width, c.height, scene, viewP(), time, k);
  c.toBlob(b => download(`${fileBase()}.png`, b));
}

// Видео: запись холста во время одного показа — от прилёта роя до рассыпания.
// MP4, где браузер его пишет (Chrome, Safari), иначе WebM.
let rec = null;
function startVideo() {
  if (!canvas.captureStream || !window.MediaRecorder) { alert(t('noRec')); return; }
  const type = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  if (play) stopPlay();
  startPlay(true);
  if (!play) return;
  const mr = new MediaRecorder(canvas.captureStream(60), type ? { mimeType: type, videoBitsPerSecond: 16e6 } : {});
  const chunks = [];
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    const ty = mr.mimeType || type || 'video/webm';
    download(`${fileBase()}.${ty.includes('mp4') ? 'mp4' : 'webm'}`, new Blob(chunks, { type: ty }));
  };
  mr.start(250); rec = mr; renderMenu();
}
function stopVideo() {
  const mr = rec; rec = null; renderMenu();
  if (mr && mr.state !== 'inactive') mr.stop();
}

// ─── Файл настроек — в расширенном режиме, раздел «файл» ─────────────────
function saveFile() {
  download('viossa-settings.json', new Blob([JSON.stringify({ alphabet: ALPHA, custom: CUSTOM, params: P }, null, 1)], { type: 'application/json' }));
}
// Своя система посетителя: алфавит, видимые настройки и язык. Скрытые параметры в файл не идут
// и из файла не берутся — даже из полного файла расширенного режима.
function saveOwn() {
  const params = Object.fromEntries(VISITOR_KEYS.map(k => [k, P[k]]));
  download('viossa-settings.json', new Blob([JSON.stringify({ alphabet: ALPHA, params, lang }, null, 1)], { type: 'application/json' }));
}
function loadOwn(j) {
  if (!j.alphabet && !j.params) throw new Error('alphabet, params');
  if (j.alphabet) {
    const next = clone(ALPHA);
    for (const p of SIGNS) {
      const g = j.alphabet[p.id];
      if (g && Array.isArray(g.lines) && g.lines.length === 4 && g.lines.every(l => [0, 1, 2].includes(l.t)))
        next[p.id] = { ...next[p.id], lines: g.lines.map(l => ({ t: l.t })) };
    }
    // как и в меню алфавита: у двух букв не может быть одного знака
    const seen = {}, twins = [];
    for (const p of SIGNS) { const c = codeOf(next[p.id]); if (seen[c]) twins.push(`${seen[c]} = ${p.id}`); else seen[c] = p.id; }
    if (twins.length) { alert(t('badAlphabet') + twins.join(', ')); return; }
    ALPHA = next; store.set('alphabet', ALPHA);
  }
  if (j.params) for (const k of VISITOR_KEYS) if (k in j.params && typeof j.params[k] === typeof START[k]) P[k] = j.params[k];
  saveParams();
  if (j.lang in LANGS) setLang(j.lang);
  applyTheme(); rebuild(); dirty = true; renderMenu();
}
let fileMode = 'full';
function openFile(mode) { fileMode = mode; $('#file').click(); }
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (fileMode === 'own') { loadOwn(j); e.target.value = ''; return; }
    if (j.custom) { const ids = new Set(CUSTOM.map(c => c.id)); CUSTOM = [...CUSTOM, ...j.custom.filter(c => !ids.has(c.id))]; store.set('custom', CUSTOM); }
    if (j.alphabet) ALPHA = { ...clone(DEFAULTS), ...j.alphabet };
    if (j.params) P = { ...START, ...j.params };
    store.set('alphabet', ALPHA); saveParams();
    applyTheme(); rebuild(); renderMenu();
  } catch (err) { alert(t('notSettings') + err.message); }
  e.target.value = '';
};
function resetAll() {
  if (!confirm(t('confirmReset'))) return;
  P = { ...START }; ALPHA = clone(DEFAULTS);
  saveParams(); store.set('alphabet', ALPHA);
  applyTheme(); rebuild(); renderMenu();
}

// ─── Расширенный режим: Ctrl+Shift+. ─────────────────────────────────────
// Включает листалку разделов в меню настроек. Повторное нажатие возвращает вид посетителя.
addEventListener('keydown', e => {
  // по коду клавиши — тогда раскладка не важна; по символу — на случай, если кода нет
  if (e.ctrlKey && e.shiftKey && (e.code === 'Period' || ['.', '>', 'ю', 'Ю'].includes(e.key))) {
    e.preventDefault();
    admin = !admin; store.set('admin', admin); document.body.classList.toggle('admin', admin);
    P = loadParams(); page = 0; store.set('page', 0);
    applyTheme(); rebuild(); setZoom(P.zoom);
    setMenu('settings');
  } else if (e.key === 'Escape' && openMenu) {
    const b = $(BUTTONS[openMenu]); setMenu(null); b.focus();
  }
});

// ─── Обратно на сайт ─────────────────────────────────────────────────────
// Только когда страница открыта с сервера. Пришёл с того же сайта — шаг назад, иначе на главную.
if (location.protocol.startsWith('http')) {
  const back = $('#back-btn');
  back.hidden = false;
  document.documentElement.style.setProperty('--back', '46px');
  back.addEventListener('click', e => {
    if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); }
  });
}

// ─── Масштаб — на холсте: кнопки в углу, колесо мыши и щипок на тачпаде ───
function setZoom(z) { P.zoom = Math.min(4, Math.max(0.3, z)); saveParams(); dirty = true; }
$('#zoom-in').onclick = () => setZoom(P.zoom * 1.25);
$('#zoom-out').onclick = () => setZoom(P.zoom / 1.25);
canvas.addEventListener('wheel', e => { e.preventDefault(); setZoom(P.zoom * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015))); }, { passive: false });

document.body.classList.toggle('admin', admin);
setLang(lang); rebuild();
if (matchMedia('(pointer: fine)').matches) textEl.focus();
</script>
